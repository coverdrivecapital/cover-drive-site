  <style>
    /* Brand colors — swap these to your exact deck hexes if needed */
    :root{
      --bg: #F9F6F1;  /* background */
      --fg: #0E3B2E;  /* text */
    }

    /* Base reset + typography */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;             /* removes any scrollbars */
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Full-viewport center; svh/dvh handle mobile browser chrome correctly */
    .wrap {
      height: 100vh;   /* fallback */
      height: 100svh;  /* small viewport height (mobile) */
      height: 100dvh;  /* dynamic viewport height (modern) */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      position: relative;
      z-index: 1;
    }

    /* Two-line lockup */
    .title-group {
      display: inline-block;
      line-height: 1;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
      margin: 0; /* ensure no default h1 margins */
    }
    .title-group .line1 {
      display: block;
      font-weight: 400;
      letter-spacing: 0.075em;              /* slightly wider */
      font-size: clamp(24px, 5vw, 80px);    /* responsive size */
      margin: 0;
    }
    .title-group .line2 {
      display: block;
      font-weight: 400;
      letter-spacing: 0.12em;
      font-size: clamp(18px, 2.8vw, 36px);
      margin-top: 0.06em;                   /* tight lock under line1 */
    }

    .logo-grid {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: clamp(12px, 3vw, 28px);
      padding: clamp(24px, 6vw, 64px);
      opacity: 0.12;
      filter: grayscale(100%);
      pointer-events: none;
      z-index: 0;
      align-items: center;
      justify-items: center;
    }

    .logo-cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(14, 59, 46, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12%;
      box-shadow: 0 6px 18px rgba(14, 59, 46, 0.04);
    }

    .logo-cell img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
